name: Compaq Computer Corporation
description: 'Compaq Computer Corporation was an American personal-computer company founded in 1982 in
  Houston, Texas by Rod Canion, Jim Harris, and Bill Murto. It pioneered IBM PC-compatible portable
  computers with the 1983 Compaq Portable and grew into one of the largest PC manufacturers of the 1990s,
  acquiring Digital Equipment Corporation in 1998. Compaq merged with Hewlett-Packard in 2002; the brand
  was gradually retired and its operations absorbed into HP. It survives in the API Evangelist network as a
  historical portfolio-company profile (backed by kleiner-perkins); it operates no present-day developer
  portal, public API, or SDK surface, as compaq.com now resolves to HP infrastructure.'
